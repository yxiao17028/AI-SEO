<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}AI SEO Studio{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body>
{% if current_user %}<aside class="sidebar"><a class="brand" href="{{url_for('dashboard')}}">AI SEO<span>Studio</span></a><nav><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('websites')}}">Websites</a><a href="{{url_for('ai_optimizer')}}">AI Optimizer</a><a href="{{url_for('logout')}}">Log out</a></nav><div class="user">{{current_user.name}}<small>{{current_user.email}}</small></div></aside>{% endif %}
<main class="{% if current_user %}app-main{% else %}public-main{% endif %}">{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{url_for('static',filename='app.js')}}"></script></body></html>
